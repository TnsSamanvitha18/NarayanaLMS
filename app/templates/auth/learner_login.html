{% extends 'base.html' %}

{% block public_content %}
<div class="d-flex align-items-center justify-content-center flex-grow-1 py-5">
    <div class="card card-gradient-purple border-0 shadow-lg p-4" style="max-width: 450px; width: 92%; border-radius: 28px !important;">
        <div class="card-body text-center p-3">
            <div class="mb-4">
                <div class="gradient-purple text-white rounded-circle p-3 d-inline-flex mb-3 shadow-sm">
                    <i class="fa-solid fa-qrcode fa-2x"></i>
                </div>
                <h4 class="fw-extrabold text-gradient-primary">LEARNER PORTAL LOGIN</h4>
                <p class="text-muted small">Narayana Learning Hub Attendance & Training</p>
                {% if class_id %}
                <div class="badge bg-success py-2 px-3 fs-6 rounded-pill mb-2">
                    <i class="fa-solid fa-chalkboard-user me-1"></i> Class Code: {{ class_id }}
                </div>
                {% endif %}
            </div>

            {% if error %}
            <div class="alert alert-danger py-2 fs-6 mb-4">
                <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('auth.learner_login') }}">
                <input type="hidden" name="class_id" value="{{ class_id or '' }}">
                <input type="hidden" name="course_id" value="{{ course_id or '' }}">

                <div class="login-field mb-3">
                    <label for="global_id" class="login-label">
                        <i class="fa-solid fa-id-badge text-teal"></i> Global ID
                    </label>
                    <input type="text" class="form-control-login" id="global_id" name="global_id" placeholder="Enter Global ID (e.g. 10001)" required value="10001">
                </div>

                <div class="login-field mb-4">
                    <label for="password" class="login-label">
                        <i class="fa-solid fa-lock text-teal"></i> Password
                    </label>
                    <input type="password" class="form-control-login" id="password" name="password" placeholder="Enter password" value="learner">
                </div>

                <button type="submit" class="btn btn-navy text-white w-100 py-3 fw-bold shadow-sm" style="border-radius: 14px;">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Continue to Class Training
                </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center">
                <span class="badge bg-light text-dark border"><i class="fa-brands fa-google text-danger me-1"></i> Ready for Google SSO Swap</span>
                <div class="mt-2">
                    <a href="{{ url_for('auth.admin_login') }}" class="text-muted small text-decoration-none">Switch to L&D Admin Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
