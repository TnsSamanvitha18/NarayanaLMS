{% extends 'base.html' %}

{% block public_content %}
<div class="d-flex align-items-center justify-content-center flex-grow-1 py-5" style="background: linear-gradient(135deg, #003366 0%, #1E293B 100%);">
    <div class="card glass-card border-0 shadow-lg p-4" style="max-width: 420px; width: 90%;">
        <div class="card-body text-center p-3">
            <div class="mb-4">
                <i class="fa-solid fa-graduation-cap text-gold fa-3x mb-2"></i>
                <h4 class="fw-bold text-navy">NARAYANA LEARNING HUB</h4>
                <p class="text-muted small">Learning & Development (L&D) Portal</p>
            </div>

            {% if error %}
            <div class="alert alert-danger py-2 fs-6 mb-4" role="alert">
                <i class="fa-solid fa-circle-exclamation me-1"></i> {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('auth.admin_login') }}">
                <div class="form-floating mb-3 text-start">
                    <input type="text" class="form-control" id="username" name="username" placeholder="admin" required value="admin">
                    <label for="username"><i class="fa-solid fa-user me-1"></i> Username</label>
                </div>
                <div class="form-floating mb-4 text-start">
                    <input type="password" class="form-control" id="password" name="password" placeholder="admin" required value="admin">
                    <label for="password"><i class="fa-solid fa-lock me-1"></i> Password</label>
                </div>

                <button type="submit" class="btn btn-navy bg-navy text-white w-100 py-2.5 fw-bold shadow-sm rounded-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Login to L&D Dashboard
                </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center">
                <small class="text-muted">Temporary L&D Admin Login (admin / admin)</small>
                <div class="mt-2">
                    <a href="{{ url_for('auth.learner_login') }}" class="text-navy text-decoration-none small fw-medium">
                        <i class="fa-solid fa-user-graduate me-1"></i> Learner Login Portal
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
